<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your journey · Maths Wednesdays</title><link rel="stylesheet" href="../../mw-design/themes/tokens.css?v=focus3"><link rel="stylesheet" href="explore.css"><script src="../../mw-design/themes.js?v=focus3"></script><style>
.journey-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:36px;align-items:start}.route{position:relative;padding:20px 20px 40px;display:flex;flex-direction:column;gap:32px;align-items:center}.route:before{content:'';position:absolute;top:50px;bottom:70px;left:50%;border-left:7px solid var(--edge)}.stop{z-index:1;position:relative;width:180px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--ink);font-weight:700}.stop:nth-child(even){transform:translateX(55px)}.stop:nth-child(odd){transform:translateX(-55px)}.stop:before{content:'';position:absolute;width:55px;top:38px;height:6px;background:var(--edge);z-index:-1}.stop:nth-child(even):before{right:50%}.stop:nth-child(odd):before{left:50%}.disc{display:grid;place-items:center;width:80px;height:80px;border:3px solid var(--edge);border-bottom-width:7px;border-radius:50%;background:var(--panel);font-size:32px}.stop[aria-current=step] .disc{border-color:var(--accent);box-shadow:0 0 0 7px var(--soft)}.stop.done .disc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.challenge{position:sticky;top:24px;background:var(--panel);border:1px solid var(--edge);border-radius:24px;padding:28px}.challenge h2{font-size:28px;margin:8px 0}.challenge p{font-size:18px}.challenge a,.challenge button{display:block;text-align:center;width:100%;padding:13px;border-radius:14px;margin-top:12px;text-decoration:none;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font-weight:700}.challenge a{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}progress{width:100%;height:12px;accent-color:var(--accent)}.progress-note{font-size:14px!important;color:var(--muted)}.path-picker{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.path-picker button{border:1px solid var(--edge);border-radius:24px;padding:10px 20px;background:var(--panel);color:var(--ink)}.path-picker button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.challenge .undo{font-size:14px;font-weight:400;background:transparent;border:0}.status{color:var(--accent);font-size:14px;min-height:24px} @media(max-width:720px){.journey-layout{grid-template-columns:1fr;gap:12px}.challenge{position:static;grid-row:1;padding:20px}.route{padding-top:25px;gap:24px}}

.river-map{position:relative;border:1px solid var(--edge);border-radius:var(--radius);background:var(--soft);overflow:hidden;min-height:810px}.river-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.route{height:810px;justify-content:space-around;padding:20px;gap:0}.route:before,.stop:before{display:none}.stop{width:180px;max-width:55%;font-size:16px;cursor:pointer}.stop>span:last-child{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:5px 10px;line-height:1.3}.stop:nth-child(even){transform:translateX(60px)}.stop:nth-child(odd){transform:translateX(-60px)}.disc{width:68px;height:68px;box-shadow:0 5px 0 #0002}.stop[aria-current=step]:after{content:'⛵';position:absolute;font-size:32px;left:calc(50% + 40px);top:18px;filter:drop-shadow(0 3px 2px #0002)}.challenge{border-radius:var(--radius)}@media(max-width:720px){.journey-layout{display:flex;flex-direction:column}.river-map{width:100%;min-height:610px}.route{height:610px}.challenge{width:100%;position:sticky;bottom:8px;top:auto;z-index:3;padding:16px;box-shadow:0 6px 24px #0003}.challenge h2{font-size:22px}.challenge p{margin:6px 0}.challenge .eyebrow,.challenge .status:empty{display:none}.challenge a,.challenge button{margin-top:7px;padding:10px}.footnote{font-size:14px}}
</style></head><body><header class="top"><a class="brand" href="index.html">Maths Wednesdays</a><nav><a class="tab" href="index.html">Explore</a><span class="tab active">My journey</span></nav><details class="settings"><summary aria-label="Theme settings">⚙</summary><div><label>Theme<select id="theme-choice"></select></label></div></details></header><main><p class="eyebrow">ONE DISCOVERY AT A TIME</p><h1>Follow your curiosity.</h1><div class="path-picker" aria-label="Choose a learning route"></div><div class="journey-layout"><div class="river-map"><svg class="river-art" viewBox="0 0 500 810" preserveAspectRatio="none" aria-hidden="true"><path d="M270 -30 C80 70 420 140 280 240 S80 350 250 425 S420 560 240 650 S130 750 270 850" fill="none" stroke="#77c8dc" stroke-width="90"/><path d="M270 -30 C80 70 420 140 280 240 S80 350 250 425 S420 560 240 650 S130 750 270 850" fill="none" stroke="#c0f1f4" stroke-width="3" stroke-dasharray="15 28"/><g fill="#3e9178"><path d="M40 100l25-55 25 55h-17v20H57v-20zM400 350l25-55 25 55h-17v20h-16v-20zM40 610l25-55 25 55h-17v20H57v-20z"/></g><g fill="#f3c870" stroke="#735b45" stroke-width="3"><path d="M355 170h65v60h-65z"/><path d="M345 170l43-40 43 40z"/><circle cx="422" cy="225" r="25" fill="none" stroke-width="7"/><path d="M422 200v50m-25-25h50M50 430h80v16H50zM65 420v40m50-40v40"/><path d="M350 695h85v16h-85zM370 680v65m45-65v65"/></g><g fill="#f5e5b7"><ellipse cx="55" cy="270" rx="17" ry="10"/><ellipse cx="450" cy="580" rx="21" ry="11"/></g></svg><div class="route" aria-label="Activity route"></div></div><section class="challenge" aria-label="Selected challenge"></section></div><p class="footnote">Journey ticks are your own record of trying a challenge, not an assessed result. Saved on this device. Every stop is available.</p></main><script>
const paths={curves:{name:'Curves & motion',stops:[['Ramp racer','Predict which ramp wins. Race, change the first drop, then race again.','puzzles/sessions/curve-lab.html#race','◒'],['Draw a route','Plot points to make a curve. What changes when you move one point?','puzzles/sessions/curve-lab.html#map','⌁'],['Aim & bounce','Shoot from the focus. Then try from somewhere else. What do you notice?','puzzles/sessions/curve-lab.html#pool','◎'],['Catch a signal','Move the receiver until the reflected rays meet it.','puzzles/sessions/curve-lab.html#radar','◔'],['Twist a tower','Can straight rods make a curved surface? Twist and inspect.','puzzles/string-lab/tower.html','⋈']]},coding:{name:'Code & create',stops:[['Meet your robot','Build a robot and choose its features. Describe the changes you made.','games/robot.html','▣'],['First instructions','Move around the grid. Predict where your instructions will finish.','puzzles/sessions/code-grid.html','⌘'],['Make a loop','Try repeating a short sequence of moves. Can you use fewer instructions?','puzzles/sessions/code-grid.html','↻'],['Robot trails','Plan a route, try it, and fix one instruction if needed.','puzzles/sessions/codebot.html','⌁'],['Send a secret','Encode a message and explain how someone could decode it.','games/cipher.html','◇']]},logic:{name:'Logic detective',stops:[['Spot a match','Compare Dobble cards. Find what they share.','dobble/index.html','◈'],['Across the river','Get everyone across. Explain why something must come back.','river-crossing/index.html','≈'],['Build a tower','Try Hanoi with a few discs. Predict how more discs change the task.','hanoi/index.html','▱'],['Crack a code','Use earlier clues to rule out a Mastermind guess.','mastermind/Mastermind_Maths_Wednesdays.html','●'],['A useful wrong guess','Can a guess teach you something even when it cannot be the answer? Try it.','mastermind/Mastermind_Maths_Wednesdays.html','?']]}};
let done={};try{done=JSON.parse(localStorage.getItem('mw-journey-tried-v1'))||{}}catch{};if(typeof done!=='object'||Array.isArray(done))done={};let route='curves',selected=0;const $=s=>document.querySelector(s);function marked(i){return done[route+':'+i]===true}function save(){try{localStorage.setItem('mw-journey-tried-v1',JSON.stringify(done))}catch{}}
function render(){const p=paths[route],count=p.stops.filter((_,i)=>marked(i)).length;$('.path-picker').innerHTML=Object.entries(paths).map(([k,v])=>`<button data-route="${k}" aria-pressed="${k===route}">${v.name}</button>`).join('');$('.route').innerHTML=p.stops.map((s,i)=>`<button class="stop ${marked(i)?'done':''}" data-stop="${i}" ${selected===i?'aria-current="step"':''} aria-label="${s[0]}${marked(i)?', tried':''}"><span class="disc" aria-hidden="true">${marked(i)?'✓':s[3]}</span><span>${s[0]}</span></button>`).join('');const s=p.stops[selected];$('.challenge').innerHTML=`<p class="eyebrow">${p.name}</p><progress value="${count}" max="${p.stops.length}" aria-label="Challenges marked tried"></progress><p class="progress-note">${count} of ${p.stops.length} challenges tried</p><h2>${s[0]}</h2><p>${s[1]}</p><a href="../../${s[2]}" target="_blank" rel="noopener">Open activity <span class="sr-only">in a new tab</span></a><button id="tried">${marked(selected)?'Continue to next stop':'I’ve tried this'}</button>${marked(selected)?'<button class="undo" id="unmark">Remove this tick</button>':''}<p class="status" role="status">${marked(selected)?'✓ Marked as tried':''}</p>`;}
document.addEventListener('click',e=>{const r=e.target.closest('[data-route]'),s=e.target.closest('[data-stop]');if(r){route=r.dataset.route;selected=paths[route].stops.findIndex((_,i)=>!marked(i));if(selected<0)selected=0;render()}if(s){selected=+s.dataset.stop;render()}if(e.target.id==='tried'){if(marked(selected))selected=(selected+1)%paths[route].stops.length;else{done[route+':'+selected]=true;save()}render();$('#tried').focus()}if(e.target.id==='unmark'){delete done[route+':'+selected];save();render();$('#tried').focus()}});render();
</script></body></html>
